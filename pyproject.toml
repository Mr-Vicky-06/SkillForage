[project]
name = "skillforge"
version = "0.1.0"
description = "Local intelligent skill library & context-aware router for Google Antigravity"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
skillforge = "skillforge.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

